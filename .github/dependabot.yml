version: 2
updates:
  # Keep npm dependencies up to date
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
    ignore:
      - dependency-name: "typescript"
        versions: ["7.x"]
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Bundle minor/patch updates into one PR instead of dozens
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # Major version bumps stay ungrouped
    commit-message:
      prefix: "chore"
      include: "scope"

  # Keep GitHub Actions workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
